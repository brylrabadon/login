<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – BRYL</title>
    <link rel="stylesheet" href="../css/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="page-bg">
        <img src="../img/profile2.jpg" alt="">
        <div class="page-bg-overlay"></div>
    </div>

    <nav class="navbar">
        <span class="logo"><img src="../img/logo.jpg" alt="BRYL Logo" class="nav-logo"></span>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <a href="../login.html" class="btn-logout">Log Out</a>
    </nav>

    <main class="page-content">
        <section class="hero">
            <h1>Contact <span class="gradient-text">Us</span></h1>
            <p class="subtitle">Have a question or just want to say hi? Send us a message.</p>
        </section>

        <section class="contact-form-wrapper">
            <form class="contact-form" action="contact.html" method="GET">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message..." rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </section>
    </main>

</body>
</html>
